aid: cerpro
name: CERPRO
description: >-
  CERPRO is a Berlin-based industrial software company building AI-powered
  quality-assurance and process automation for small and medium-sized
  manufacturers. Its flagship product, QualiSpec, uses computer-vision and
  large-model AI to automatically extract features, dimensions, tolerances and
  drill-hole specifications from technical drawings (PDF, JPG, DXF) and generate
  inspection reports and quality documents in customized templates such as VDA,
  EMPB and inspection plans. This removes manual copy-paste and data-entry work
  from quality control, cutting documentation time by up to 70-90% and reducing
  errors while creating a unified data foundation that connects OEMs and
  suppliers. Since launching in December 2024 the software has been adopted by
  more than 100 SMEs across aerospace, medical devices and mechanical
  engineering. CERPRO is a Techstars portfolio company and raised a ~EUR 2M
  pre-seed round in 2025. The product is delivered as a cloud SaaS platform
  (platform.cerpro.io) hosted on AWS in Germany, with an ISO 27001 certified,
  GDPR/BDSG-compliant data-security posture.
